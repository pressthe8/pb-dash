name: Build Firebase Functions

on:
  push:
    branches: [dev, main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions-build.yml'
  pull_request:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
